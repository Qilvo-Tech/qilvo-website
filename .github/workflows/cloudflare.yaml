name: Cloudflare Worker

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-and-deploy:
    runs-on: ubuntu-22.04
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.148.2"
          extended: true

      - name: Install dependencies
        run: npm ci

      - name: Check Worker
        run: npm run check

      - name: Build website
        run: npm run build

      - name: Validate deployment
        if: github.event_name == 'pull_request'
        run: npx wrangler deploy --dry-run --minify

      - name: Apply D1 migrations
        if: github.ref == 'refs/heads/main' && env.CLOUDFLARE_API_TOKEN != ''
        run: npx wrangler d1 migrations apply qilvo-wishlists --remote

      - name: Deploy to Cloudflare
        if: github.ref == 'refs/heads/main' && env.CLOUDFLARE_API_TOKEN != ''
        run: npx wrangler deploy --minify

      - name: Report missing deployment credentials
        if: github.ref == 'refs/heads/main' && env.CLOUDFLARE_API_TOKEN == ''
        run: echo "::warning::CLOUDFLARE_API_TOKEN is not configured; verification passed but deployment was skipped."
